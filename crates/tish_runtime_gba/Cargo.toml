[package]
name = "tishlang_runtime_gba"
version = "0.1.0"
edition = "2021"
description = "no_std runtime facade for Tish compiled output on the Game Boy Advance (agb)"
# Spelled out, NOT `{ workspace = true }`: this crate is in the workspace `exclude` list, so it has
# no workspace root to inherit from. Without these, `cargo publish` refuses the crate outright,
# which is why it is the one tishlang_* crate that never shipped.
#
# The LICENSE is a COPY, not the root one: cargo requires license-file to resolve inside the
# package directory, and `../../LICENSE` is not packaged.
license-file = "LICENSE"
repository = "https://github.com/tishlang/tish"

# The GBA `Gba` emit mode declares the generated crate's dependency as
#   tishlang_runtime = { package = "tishlang_runtime_gba", path = ... }
# so every emitted `tishlang_runtime::…` path resolves here (the package-rename
# zero-churn trick). This crate re-exports the portable prelude surface from
# tishlang_core / tishlang_builtins and adds the GBA `gba::{init, halt, hooks}`.

[dependencies]
tishlang_core = { path = "../tish_core", version = ">=0.1", default-features = false, features = ["portable"] }
tishlang_builtins = { path = "../tish_builtins", version = ">=0.1", default-features = false, features = ["portable"] }
agb = "0.25.0"
