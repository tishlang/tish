[package]
name = "tishlang_test"
version = "0.1.0"
edition = "2021"
description = "Native tish test runner, expect, and Node-compatible assert"
license-file = { workspace = true }
repository = { workspace = true }

[features]
default = ["fs", "regex", "promise"]
# Fan features into runtime + optional eval/vm so send-values / regex stay consistent.
fs = ["tishlang_runtime/fs", "tishlang_eval/fs", "tishlang_vm/fs"]
regex = [
    "tishlang_core/regex",
    "tishlang_runtime/regex",
    "tishlang_eval/regex",
    "tishlang_vm/regex",
]
promise = ["tishlang_runtime/promise", "tishlang_vm/promise"]
# Full runner needs compile + VM to load files
runner = [
    "dep:tishlang_compile",
    "dep:tishlang_opt",
    "dep:tishlang_bytecode",
    "dep:tishlang_vm",
    "dep:tishlang_ast",
    "dep:tishlang_eval",
]
watch = ["dep:notify"]

[dependencies]
tishlang_core = { path = "../tish_core", version = ">=0.1" }
tishlang_builtins = { path = "../tish_builtins", version = ">=0.1" }
tishlang_runtime = { path = "../tish_runtime", version = ">=0.1" }
tishlang_ast = { path = "../tish_ast", version = ">=0.1", optional = true }
tishlang_compile = { path = "../tish_compile", version = ">=0.1", optional = true }
tishlang_opt = { path = "../tish_opt", version = ">=0.1", optional = true }
tishlang_bytecode = { path = "../tish_bytecode", version = ">=0.1", optional = true }
tishlang_vm = { path = "../tish_vm", version = ">=0.1", optional = true }
tishlang_eval = { path = "../tish_eval", version = ">=0.1", optional = true }
serde_json = "1"
walkdir = "2"
regex = "1"
notify = { version = "7", optional = true }

[dev-dependencies]
tempfile = "3"
